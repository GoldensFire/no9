# Ежечасный обход за новыми паками.
#
# Ночной обход (nightly.yml) делает всё и потому идёт часами: он обходит
# обсуждения, снимает статистику по одиннадцати тысячам паков, размечает очередь
# и упирается в лимиты Gemini. Ради пака, выложенного в обсуждение в полдень,
# ждать до полуночи незачем — а именно так и выходило: сутки от выкладки
# до появления на сайте.
#
# Здесь же делается ровно одно: посмотреть, не появилось ли нового, и если
# появилось — прогнать это новое всеми средствами разом. Разобрать файл, снять
# статистику, разметить моделью, описать, скачать обложку, посчитать спецвопросы
# и выложить наверх.
#
# Почему это дёшево. Работы тут ровно столько, сколько новых паков, а их за час
# появляется ноль или один. Обсуждения при этом читаются с конца и ровно до того
# места, на котором кончил предыдущий такой же обход (ключ --tail, отметка —
# в src/indexer/tail.js, чтение — readTopicSince в src/vkapi.js): это одно-два
# обращения к ВК на тему вместо двухсот шестидесяти, то есть секунды вместо
# десяти минут. Дальше очередь либо пуста — и всё кончается тут же, — либо
# в ней один пак.
#
# Отметка «докуда дочитали» стоит здесь вместо прежних «сутки назад», и стоит
# ради пропусков. Расписание ниже — обещание, а не будильник, и при общей
# загрузке GitHub часть запусков пропускает вовсе; пропуск длиннее двух суток
# означал дыру, в которую выложенный пак ежечасному обходу не попадался уже
# никогда. Теперь длина хвоста равна длине пропуска, какой бы она ни была.
#
# В лимиты Gemini один пак в час не упирается почти никогда: суточных запросов
# пятьсот, а тратится за сутки два десятка. А когда всё-таки упирается — ночь
# перед этим выбрала квоту до дна, — обход переходит на любую другую модель,
# начиная с самой мощной (ключ --fallback=any, см. HOUR_FALLBACK
# в scripts/nightly.js). Ночь так не делает нарочно: у неё в очереди тысячи
# паков и переключение решает, чем размечена половина базы, а здесь пак один,
# и оставить его до утра неразмеченным хуже, чем разметить чем придётся.
#
# Пропавших и подменённых файлов ежечасный обход не замечает: судить об этом
# вправе только тот, кто прочитал тему до конца. Это работа ночи, и она её делает.
#
# Почему полный набор шагов, а не «разобрать и ладно». Пак, попавший на сайт
# без разметки, — это карточка без типа, без описания, без сложности и без
# обложки; она не находится ни одним отбором и висит серой строкой до ближайшей
# ночи. Сделать всё сразу дешевле, чем показать наполовину.
#
# База — та же, что у ночного обхода, и лежит она на той же полке (приложение
# к отметке релиза «state», см. scripts/state.js). Одновременно работать по ней
# нельзя, поэтому оба обхода стоят в одной очереди concurrency: пришёл час,
# а ночь ещё идёт — ежечасный подождёт её и возьмёт базу следом.

name: Новые паки каждый час

on:
  schedule:
    # Каждый час, в начале часа. Расписание в GitHub — обещание, а не будильник:
    # при общей загрузке запуск сдвигается на десяток-другой минут, и часть
    # запусков пропускается вовсе. Для «посмотреть, нет ли нового» это
    # безразлично: пропущенный час подберёт следующий.
    - cron: '0 * * * *'

  # Тот же обход руками — со страницы Actions.
  workflow_dispatch:

# Очередь общая с ночным обходом: база одна, и работать по ней вдвоём нельзя.
# cancel-in-progress здесь особенно вреден — отменённый посреди работы обход
# оставил бы полку нетронутой, а сделанное выбросил.
concurrency:
  group: firepacks-state
  cancel-in-progress: false

jobs:
  hourly:
    runs-on: ubuntu-latest

    # Предохранитель. Обычный запуск укладывается в считаные минуты; своё время
    # обход считает сам (см. --minutes ниже) и уходит раньше этого числа.
    timeout-minutes: 30

    permissions:
      # Нужно ровно одно: перезаписать приложение к отметке релиза.
      contents: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      # Чем уменьшать обложки новых паков. Готовые копии приезжают вместе
      # с базой, но у пака, разобранного этим самым обходом, их ещё нет.
      #
      # Главный здесь — ffmpeg, и это не вкусовщина. Обе копии проекта пишутся
      # в AVIF (см. thumbName и previewName в src/logo.js), а ImageMagick
      # в готовом образе Ubuntu — шестой версии, и AVIF он только читает:
      # `convert -list format` показывает у него `AVIF r--`. На просьбу записать
      # копию он не отказывается — пишет предупреждение и кладёт по имени копии
      # исходный png или jpg. Пишет AVIF на этой машине один ffmpeg.
      #
      # ImageMagick остаётся рядом: он читает форматы, которых не знает ffmpeg,
      # и что из них двоих сработает, решает уже сам код — по первым байтам
      # того, что получилось (см. resizeInto в src/thumbs.js).
      #
      # Со сроком и с правом не получиться — по той же причине, что и в ночном
      # обходе: apt умеет ждать чужой замок бесконечно, и обход, который весь
      # должен уложиться в пару минут, висел бы на этом до предохранителя.
      - name: Поставить ImageMagick и ffmpeg
        timeout-minutes: 5
        continue-on-error: true
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get -o DPkg::Lock::Timeout=60 update -qq
          sudo -E apt-get -o DPkg::Lock::Timeout=60 install -y --no-install-recommends imagemagick ffmpeg

      # Право не получиться у шага выше есть, а у обложек последствия молчаливые:
      # пак уедет наверх со строкой «обложка есть» и без файла за ней. Поэтому
      # спрашиваем прямо и говорим вслух — обход при этом не останавливаем:
      # база важнее картинок.
      - name: Проверить, что обложки будет чем уменьшать
        continue-on-error: true
        run: |
          if ffmpeg -hide_banner -muxers 2>/dev/null | grep -qi ' avif '; then
            echo "ffmpeg умеет AVIF — обложки будут."
          else
            echo "::warning::ffmpeg с поддержкой AVIF не нашёлся. Обложки новых паков не сделаются, и на сайте у них будет квадрат с буквой. Починит ближайший обход, у которого ffmpeg будет на месте (шаг «логотипы»)."
          fi

      - run: npm ci

      # Без ключа ВК обход новых паков бессмыслен: смотреть, откуда они берутся,
      # больше неоткуда. Поэтому здесь это не предупреждение, а причина не начинать:
      # запуск завершается успехом, ничего не тронув, — база остаётся на полке
      # такой, какой была.
      - name: Проверить, что есть чем ходить
        id: keys
        env:
          VK_TOKEN: ${{ secrets.VK_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$VK_TOKEN" ]; then
            echo "::warning::Ключа VK_TOKEN нет — искать новые паки нечем. Обход пропущен."
            echo 'go=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::Ключей Cloudflare нет — найденное ляжет на полку, но на сайт не поедет."
            echo 'deploy=false' >> "$GITHUB_OUTPUT"
          else
            echo 'deploy=true' >> "$GITHUB_OUTPUT"
          fi

          echo 'go=true' >> "$GITHUB_OUTPUT"

      - name: Забрать базу с полки
        id: state
        if: steps.keys.outputs.go == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node --no-warnings scripts/state.js pull

      # Тот же самый ночной обход, только его первой половиной: --only-fresh
      # делает забег за свежим и на этом заканчивает, не трогая остальную базу,
      # а --fresh=1 задаёт нижнюю границу свежести — сутки; растянуть её дальше
      # в прошлое может отметка «докуда дочитали», если запусков не было дольше
      # (см. freshSince в src/indexer/options.js). Шаги при этом полные:
      # разбор, статистика, разметка, описание, обложка, спецвопросы, отпечатки
      # вопросов с чужими ссылками, длительность медиа, авторы, копии, плагиат
      # и пересчёт (см. FRESH_STEPS в scripts/nightly.js). Пак уезжает на сайт
      # доделанным до конца, а не наполовину, и сделанное здесь ночь второй раз
      # делать не станет.
      #
      # Заодно --only-fresh включает чтение обсуждений с конца (см. TAIL
      # в scripts/nightly.js): всю тему читает ночь, а здесь нужен только хвост.
      - name: Посмотреть, нет ли новых паков
        if: steps.keys.outputs.go == 'true'
        env:
          VK_TOKEN: ${{ secrets.VK_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEPLOY: ${{ steps.keys.outputs.deploy }}
        run: |
          args="--only-fresh --fresh=1 --minutes=25"
          if [ "$DEPLOY" != "true" ]; then args="$args --no-deploy"; fi
          node --no-warnings scripts/nightly.js $args

      # Кладём базу обратно в любом случае — даже если обход оборвался: разобранное
      # до обрыва не надо делать заново. Если база не приехала, класть нечего,
      # и трогать лежащее на полке нельзя ни в коем случае.
      #
      # Без --force по той же причине, что и в ночном обходе: этот ходит раз
      # в час и потому чаще всех попадает на полку, с которой домашняя машина
      # только что ушла вперёд. Затирать её нельзя — сливаем (см. scripts/state.js).
      - name: Вернуть базу на полку
        if: always() && steps.state.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node --no-warnings scripts/state.js push

      - name: Отчёт об обходе
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: отчёт
          path: data/nightly
          retention-days: 7
          if-no-files-found: ignore
